name: Set up Toph tools
description: Install pinned Bun and verify the pinned Bend release archive.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version-file: .bun-version
    - name: Install Bend
      shell: bash
      run: |
        bun scripts/install-bend.ts "$RUNNER_TEMP/bend"
        echo "$RUNNER_TEMP/bend/bin" >> "$GITHUB_PATH"
